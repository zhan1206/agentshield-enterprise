server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"  # debug, release

database:
  driver: "mysql"
  host: "localhost"
  port: 3306
  name: "agentshield"
  user: "agentshield"
  password: "${DB_PASSWORD}"
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: "localhost"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0

kafka:
  brokers:
    - "localhost:9092"
  topic_audit: "agentshield-audit"
  topic_events: "agentshield-events"

elasticsearch:
  addresses:
    - "http://localhost:9200"
  index_audit: "agentshield-audit"

security:
  jwt_secret: "${JWT_SECRET}"
  jwt_expiry_hours: 24
  encryption_key: "${ENCRYPTION_KEY}"
  encryption_algorithm: "aes-256-gcm"

sandbox:
  default_isolation: "container"
  max_sandboxes: 100
  snapshot_enabled: true

audit:
  retention_days: 180
  chain_enabled: true
  compliance_standard: "djl_2_0"

tracing:
  enabled: true
  provider: "jaeger"
  endpoint: "http://localhost:14268/api/traces"
  sampling_rate: 0.1

ai:
  analyzer_host: "localhost"
  analyzer_port: 8001
  anomaly_threshold: 0.8

logging:
  level: "info"
  format: "json"
