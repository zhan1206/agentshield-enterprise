apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentshield-server
  namespace: agentshield
  labels:
    app: agentshield
    component: server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agentshield
      component: server
  template:
    metadata:
      labels:
        app: agentshield
        component: server
    spec:
      containers:
        - name: server
          image: agentshield/server:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentshield-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentshield-secrets
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: agentshield-secrets
                  key: encryption-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agentshield-server
  namespace: agentshield
spec:
  selector:
    app: agentshield
    component: server
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
