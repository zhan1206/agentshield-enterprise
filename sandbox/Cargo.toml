[package]
name = "agentshield-sandbox"
version = "0.1.0"
edition = "2021"
description = "AgentShield Enterprise - Three-tier isolation sandbox engine"
license = "Apache-2.0"

[lib]
name = "agentshield_sandbox"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
